# CD: Docker Compose on the same EC2 as nest.book-store.pl
# Bootstrap: deploy/ec2.md
# Secrets: EC2_HOST, EC2_SSH_KEY, DOCKERHUB_USERNAME, DOCKERHUB_TOKEN,
#          opcjonalnie FORMSPREE_URL (contact form, server-only)
# Variables: EC2_DEPLOY_BASE_URL, opcjonalnie VITE_API_URL, DOCKERHUB_IMAGE, SITE_URL
#
# Build → push to Docker Hub → EC2 docker pull → compose up.
# Nest Caddy reverse_proxies www.book-store.pl → www:3000.
name: Deploy to EC2 (Docker)

on:
  workflow_dispatch:

concurrency:
  group: deploy-ec2-docker
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      EC2_USER: ubuntu
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          set -euo pipefail
          USERNAME="${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME secret is required}"
          IMAGE="${DOCKERHUB_IMAGE:-${USERNAME}/www-book-store}"
          echo "WWW_IMAGE=${IMAGE}:${RELEASE_SHA}" >> "$GITHUB_ENV"
          echo "WWW_IMAGE_LATEST=${IMAGE}:latest" >> "$GITHUB_ENV"
          echo "Image: ${IMAGE}:${RELEASE_SHA}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push www image
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          set -euo pipefail
          VITE_API_URL="${VITE_API_URL:-https://strapi.book-store.com.pl/api}"
          docker build \
            --build-arg "VITE_API_URL=${VITE_API_URL}" \
            -t "${WWW_IMAGE}" \
            -t "${WWW_IMAGE_LATEST}" \
            -f Dockerfile .
          docker push "${WWW_IMAGE}"
          docker push "${WWW_IMAGE_LATEST}"

      - name: Sync Compose to EC2
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: deploy/docker/
          remote_path: /var/www/www/docker/
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ${{ env.EC2_USER }}
          remote_key: ${{ secrets.EC2_SSH_KEY }}

      - name: Pull image and activate on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: WWW_IMAGE,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,FORMSPREE_URL,SITE_URL
          script: |
            set -euo pipefail
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker pull "$WWW_IMAGE"
            chmod +x /var/www/www/docker/activate-release-docker.sh
            SITE_URL="${SITE_URL:-}"
            bash /var/www/www/docker/activate-release-docker.sh "$WWW_IMAGE"
            docker logout
        env:
          WWW_IMAGE: ${{ env.WWW_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          FORMSPREE_URL: ${{ secrets.FORMSPREE_URL }}
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Smoke test (public URL)
        env:
          DEPLOY_BASE_URL: ${{ vars.EC2_DEPLOY_BASE_URL }}
        run: |
          export DEPLOY_BASE_URL="${DEPLOY_BASE_URL:-https://www.book-store.pl}"
          bash deploy/smoke-test.sh
